name: Web app

# Builds the web (WebAssembly) version from main and publishes it to GitHub
# Pages, at https://<owner>.github.io/<repository>/.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

# Only one deployment at a time; a newer push waits for the running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the release Rust toolchain with the WebAssembly target
        shell: bash
        run: |
          rust_version=$(tr -d '[:space:]' < RUST_RELEASE_VERSION)
          rustup toolchain install "$rust_version" --profile minimal --target wasm32-unknown-unknown
          rustup override set "$rust_version"
      - name: Install trunk
        run: ./scripts/install-trunk.sh "$RUNNER_TEMP/bin" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build
        # Pages serves the site under /<repository>/, not at the domain root.
        env:
          PUBLIC_URL: /${{ github.event.repository.name }}/
        run: trunk build --release --locked --public-url "$PUBLIC_URL"
      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
